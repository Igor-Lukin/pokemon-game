<!DOCTYPE html>
<html><head><title>{{if .Item}}Редактировать{{else}}Создать{{end}} предмет — админка</title><link rel="stylesheet" href="/static/css/admin.css"></head>
<body>
<h1>{{if .Item}}Редактировать{{else}}Создать{{end}} предмет</h1>
<form method="post">
<p>Название: <input name="name" value="{{if .Item}}{{.Item.Name}}{{end}}" required></p>
<p>Описание: <textarea name="description">{{if .Item}}{{.Item.Description}}{{end}}</textarea></p>
<p>Категория: <select name="category_id" required>
{{range .Categories}}<option value="{{.ID}}" {{if $.Item}}{{if eq $.Item.CategoryID .ID}}selected{{end}}{{end}}>{{.Name}}</option>{{end}}
</select></p>
<p>Цена: <input type="number" name="price" value="{{if .Item}}{{.Item.Price}}{{else}}0{{end}}"></p>
<p>Тип эфф.: <select name="effect_type"><option value="">—</option><option value="heal_hp" {{if $.Item}}{{if eq $.Item.EffectType "heal_hp"}}selected{{end}}{{end}}>heal_hp</option><option value="heal_status" {{if $.Item}}{{if eq $.Item.EffectType "heal_status"}}selected{{end}}{{end}}>heal_status</option><option value="revive" {{if $.Item}}{{if eq $.Item.EffectType "revive"}}selected{{end}}{{end}}>revive</option><option value="catch_bonus" {{if $.Item}}{{if eq $.Item.EffectType "catch_bonus"}}selected{{end}}{{end}}>catch_bonus</option><option value="evolve" {{if $.Item}}{{if eq $.Item.EffectType "evolve"}}selected{{end}}{{end}}>evolve</option><option value="type_boost" {{if $.Item}}{{if eq $.Item.EffectType "type_boost"}}selected{{end}}{{end}}>type_boost (надеваемый)</option></select></p>
<p>Значение эфф.: <input type="number" name="effect_value" value="{{if .Item}}{{.Item.EffectValue}}{{else}}0{{end}}"> <small>для type_boost: множитель ×100 (120 = ×1.2)</small></p>
<p>Тип предмета (для надеваемых): <select name="type_id"><option value="">— нет —</option>
{{range .Types}}<option value="{{.ID}}" {{if $.Item}}{{if eq $.Item.TypeID .ID}}selected{{end}}{{end}}>{{.Name}}</option>{{end}}
</select> <small>совпадение с типом покемона включает эффект</small></p>
<p>URL иконки: <input name="image_url" value="{{if .Item}}{{.Item.ImageURL}}{{end}}" style="width:300px"></p>
<button>Сохранить</button>
</form>
<a href="/admin/items">Назад</a>
</body></html>
