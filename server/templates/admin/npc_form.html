<!DOCTYPE html>
<html>
  <head>
    <title>Create NPC</title>
    <link rel="stylesheet" href="/static/css/admin.css" />
  </head>
  <body>
    <h1>Create NPC</h1>
    <form method="POST">
      <label>Name:</label><br />
      <input type="text" name="name" value="{{ .Name }}" required /><br /><br />
      <label>Location:</label><br />
      <select name="location_id" required>
        <option value="">-- Select location --</option>
        {{range .AllLocations}}
        <option value="{{.ID}}" {{if eq .ID $.LocationID}}selected{{end}}>
          {{.Name}} (ID {{.ID}})
        </option>
        {{end}}</select
      ><br /><br />
      <button type="submit">Save</button>
      <a href="/admin/npc">Cancel</a>
    </form>
  </body>
</html>
