<!DOCTYPE html>
<html>
  <head>
    <title>{{if .ID}}Edit{{else}}Create{{end}} Location</title>
    <link rel="stylesheet" href="/static/css/admin.css" />
  </head>
  <body>
    <h1>{{if .ID}}Edit{{else}}Create{{end}} Location</h1>
    <form method="POST">
      <label>Name:</label><br />
      <input type="text" name="name" value="{{printf "%s" .Name}}" required><br /><br />
      <label>Description:</label><br />
      <input type="text" name="description" value="{{printf "%s" .Description}}"
      size="50" required><br /><br />
      <label><input type="checkbox" name="has_nursery" {{if .HasNursery}}checked{{end}}> Есть питомник</label><br />
      <label><input type="checkbox" name="has_healing" {{if .HasHealing}}checked{{end}}> Есть лечение</label><br /><br />
      <button type="submit">Save</button>
      <a href="/admin/locations">Cancel</a>
    </form>

    {{if .ID}}
    <hr />
    <h2>Manage Exits (Переходы)</h2>
    <h3>Existing Exits</h3>
    {{if .Exits}}
    <table border="1">
      <tr>
        <th>Destination</th>
        <th>Action</th>
      </tr>
      {{range .Exits}}
      <tr>
        <td>{{.Name}} (ID {{.ID}})</td>
        <td>
          <form action="/admin/locations/exit/remove" method="POST">
            <input type="hidden" name="from_location" value="{{$.ID}}" />
            <input type="hidden" name="to_location" value="{{.ID}}" />
            <button type="submit" onclick="return confirm('Remove this exit?')">
              Remove
            </button>
          </form>
        </td>
      </tr>
      {{end}}
    </table>
    {{else}}
    <p>No exits defined.</p>
    {{end}}

    <h3>Add New Exit</h3>
    <form action="/admin/locations/exit/add" method="POST">
      <input type="hidden" name="from_location" value="{{.ID}}" />
      <select name="to_location" required>
        <option value="">-- Select destination --</option>
        {{range .AllLocations}}
        <option value="{{.ID}}">{{.Name}} (ID {{.ID}})</option>
        {{end}}
      </select>
      <button type="submit">Add Exit</button>
    </form>
    {{end}}
  </body>
</html>
