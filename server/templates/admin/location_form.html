<!DOCTYPE html>
<html>
  <head>
    <title>{{if .ID}}Edit{{else}}Create{{end}} Location</title>
    <link rel="stylesheet" href="/static/css/admin.css" />
  </head>
  <body>
    <h1>{{if .ID}}Edit{{else}}Create{{end}} Location</h1>
    <form method="POST">
      <label>Name:</label><br />
      <input type="text" name="name" value="{{.Name}}" required /><br /><br />

      <label>Description:</label><br />
      <input
        type="text"
        name="description"
        value="{{.Description}}"
        size="70"
        required
      /><br /><br />

      <label>Region:</label><br />
      <select name="region_id" required>
        {{range .Regions}}
        <option value="{{.ID}}" {{if eq .ID $.RegionID}}selected{{end}}>
          {{.Name}} (ID {{.ID}})
        </option>
        {{end}}
      </select><br /><br />

      <label>
        <input type="checkbox" name="has_nursery" {{if .HasNursery}}checked{{end}} />
        Питомник
      </label><br />
      <label>
        <input type="checkbox" name="has_healing" {{if .HasHealing}}checked{{end}} />
        Лечение
      </label><br /><br />

      <button type="submit">Save</button>
      <a href="/admin/locations">Cancel</a>
    </form>

    {{if .ID}}
    <hr />
    <h2>Manage Exits (переходы)</h2>
    <h3>Existing Exits</h3>
    {{if .Exits}}
    <table border="1">
      <tr>
        <th>Destination</th>
        <th>Action</th>
      </tr>
      {{range .Exits}}
      <tr>
        <td>{{.Name}}</td>
        <td>
          <form action="/admin/locations/exit/remove" method="POST">
            <input type="hidden" name="from_location" value="{{$.ID}}" />
            <input type="hidden" name="to_location" value="{{.ID}}" />
            <button type="submit" onclick="return confirm('Remove this exit?')">
              Remove
            </button>
          </form>
        </td>
      </tr>
      {{end}}
    </table>
    {{else}}
    <p>No exits defined.</p>
    {{end}}

    <h3>Add New Exit</h3>
    <form action="/admin/locations/exit/add" method="POST">
      <input type="hidden" name="from_location" value="{{.ID}}" />
      <select name="to_location" required>
        <option value="">-- Select destination --</option>
        {{range .AllLocations}}
        <option value="{{.ID}}">{{.Name}} (ID {{.ID}})</option>
        {{end}}
      </select>
      <button type="submit">Add Exit</button>
    </form>
    <p><small>Помните: выходы должны быть двусторонними.</small></p>
    {{end}}
  </body>
</html>
