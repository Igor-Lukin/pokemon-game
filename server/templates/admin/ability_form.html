<!DOCTYPE html>
<html>
  <head>
    <title>{{if .ID}}Edit{{else}}Create{{end}} Ability</title>
    <link rel="stylesheet" href="/static/css/admin.css" />
  </head>
  <body>
    <h1>{{if .ID}}Edit{{else}}Create{{end}} Ability</h1>
    <form method="POST">
      <label>Name:</label><br />
      <input type="text" name="name" value="{{.Name}}" required /><br /><br />
      <label>Description:</label><br />
      <textarea name="description" rows="4" cols="50">{{.Description}}</textarea
      ><br /><br />
      <button type="submit">Save</button>
      <a href="/admin/abilities">Cancel</a>
    </form>
  </body>
</html>
