<div class="poke pokemonBoxCard pokemonBoxFight fighter-card minimized" data-p-id="{{.ID}}">
  <button class="bag-fab" type="button" title="Инвентарь (бол = ловля)">🎒</button>
  <div class="minicardContainer">
    <div class="minicard">
      <div class="rank txtgray2"><span>{{.Rank}}</span></div>
      <div class="fsprite image"><img src="{{.ImageURL}}" alt="{{.Name}}" /></div>
      <div class="frow1">
        <span class="fname name">{{.Name}}</span>
        <span class="flvl lvl">{{.Level}}</span>
        <div class="boxleft antioverlaybug">
          <div class="typ ftypes" style="visibility: visible">
            {{range .Types}}
            <img src="/static/images/types/{{.}}.png" class="typ" />
            {{end}}
          </div>
        </div>
      </div>
      <div class="hpbar barHP max">
        <div style="width: {{.HpPercent}}%"></div>
      </div>
      <div class="fmeta">
        <span class="hp-text hp-text-val"></span>
        <span class="hp-text exp-label" style="color: var(--accent-2)">EXP</span>
      </div>
      <div class="expbar barEXP">
        <div style="width: {{.ExpPercent}}%"></div>
      </div>
      <div class="fstatus">
        <span class="status-badge" style="display: none"></span>
      </div>
    </div>
  </div>
  <div class="moves">
    {{range .Attacks}}
    <div class="moveBox">
      <div class="divMove">
        <div class="divMoveTyp">
          <img src="/static/images/types/{{.TypeID}}.png" class="typ" />
        </div>
        <div class="divMoveInfo clickable">
          <div class="divMoveTitle category{{.CategoryID}}">{{.Name}}</div>
          <div class="divMoveFooter">
            <div class="divMoveIcons"></div>
            <div class="divMoveParams">PP {{.PP}}/{{.MaxPP}}</div>
          </div>
        </div>
      </div>
    </div>
    {{end}}
  </div>
</div>
